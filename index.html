<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>omar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
<style>
  :root { --accent: #5CFFA8; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100vh;
    box-sizing: border-box;
    padding: 32px;
    background-color: #07090A;
    background-image: repeating-linear-gradient(0deg, rgba(92,255,168,0.03) 0px, rgba(92,255,168,0.03) 1px, transparent 1px, transparent 3px);
    color: #C8D3CC;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
  }
  main { display: flex; flex-direction: column; gap: 8px; }
  .prompt { font-size: 13px; color: #7E8A83; }
  .user { color: var(--accent); }
  .path { color: #6FA8FF; }
  h1 {
    margin: 0;
    font-weight: 700;
    font-size: clamp(1.75rem, 4vw, 2.25rem);
    line-height: 1;
    letter-spacing: -0.02em;
    color: #EEF3EF;
    text-shadow: 0 0 18px rgba(92,255,168,0.25);
  }
  .cursor { color: var(--accent); animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
</style>
</head>
<body>
  <main>
    <div class="prompt"><span class="user">root@kali</span>:<span class="path">~</span>$ whoami</div>
    <h1>omar<span class="cursor">_</span></h1>
  </main>
</body>
</html>
