<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>omar</title>
<style>
  :root { --accent: #4EE06A; }
  html, body { margin: 0; background: #000; }
  body {
    min-height: 100vh;
    box-sizing: border-box;
    padding: 16px;
    color: #D0D0D0;
    font-family: ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace;
    font-size: 15px;
    line-height: 1.5;
  }
  .u { color: var(--accent); }
  .p { color: #5C9DFF; }
  h1 { margin: 0; font-size: inherit; font-weight: 400; }
  .cursor {
    display: inline-block; width: 0.6em; height: 1.1em;
    vertical-align: text-bottom; background: #D0D0D0;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
</style>
</head>
<body>
  <div><span class="u">root@kali</span>:<span class="p">~</span>$ whoami</div>
  <h1>omar</h1>
  <div><span class="u">root@kali</span>:<span class="p">~</span>$ <span class="cursor"></span></div>
</body>
</html>
